#
# Internal build pipeline. GitLab produces the artefacts that carry
# operator-supplied material (plugins, private fixtures); GitHub keeps
# publishing the sanitised public releases from .github/workflows/.
#
# The split is enforced by the repository's own boundary, not by
# convention:
#
#   * ``plugins/*`` is gitignored, so plugin implementations are never
#     in git and never reach a public checkout.
#   * ``plugins`` appears nowhere in ``yggdrasim_main.spec``, so no
#     PyInstaller bundle can contain plugin code — the bundle this
#     pipeline builds is byte-for-byte the bundle GitHub builds.
#   * plugins load at runtime from a directory, gated behind
#     ``YGGDRASIM_ALLOW_PLUGINS=1`` and hard-lockable with
#     ``YGGDRASIM_DISALLOW_PLUGINS=1``.
#
# So the internal artefact is deliberately *the same bundle plus a
# separate plugin payload*, never a fused binary. A fused build would
# put private code inside a file that looks exactly like the public
# one, which is the failure this separation exists to prevent. The
# `verify:no-private-material` job proves the property on every run
# rather than trusting it.

stages:
  - gate
  - test
  - build
  - package
  - verify
  - publish

variables:
  UV_VERSION: "0.9.9"
  PYTHON_VERSION: "3.11"
  # Oldest supported glibc — PyInstaller bundles must be built here or
  # they will not start on Debian 12 / Raspberry Pi OS.
  LINUX_BUILD_IMAGE: "ubuntu:22.04"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.uv-cache"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  GIT_DEPTH: "0"
  # Runner tags. Defaults target GitLab.com SaaS; override in
  # Settings → CI/CD → Variables for self-managed runners.
  RUNNER_TAG_LINUX_AMD64: "saas-linux-medium-amd64"
  RUNNER_TAG_LINUX_ARM64: "saas-linux-medium-arm64"
  # Windows and macOS bundles stay off until a runner exists for them.
  # Set to "true" once the tags below resolve.
  ENABLE_WINDOWS_BUILD: "false"
  ENABLE_MACOS_BUILD: "false"
  RUNNER_TAG_WINDOWS: "saas-windows-medium-amd64"
  RUNNER_TAG_MACOS: "saas-macos-medium-m1"

default:
  interruptible: true
  retry:
    max: 1
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

# ---------------------------------------------------------------------
# Shared fragments
# ---------------------------------------------------------------------

.linux_base: &linux_base
  image: "$LINUX_BUILD_IMAGE"
  tags: ["$RUNNER_TAG_LINUX_AMD64"]
  cache:
    key:
      files:
        - uv.lock
    paths:
      - .uv-cache
  before_script:
    - export DEBIAN_FRONTEND=noninteractive
    - apt-get update -qq
    - apt-get install -y -qq --no-install-recommends
      python3 python3-venv python3-dev build-essential
      libpcsclite-dev pcscd swig pkg-config gpg curl ca-certificates git
      libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      libxcb-keysyms1 libxcb-shape0 libxcb-icccm4 xauth xvfb
    - curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - uv --version

# Materialise the operator-supplied plugin payload from a protected CI
# variable. PLUGIN_PAYLOAD_B64 is a base64 tarball of plugins/ — mark it
# Protected + Masked, and File type is fine too. Absent means the job
# proceeds with no plugins, which keeps forks and MR pipelines working
# without the private material.
.load_plugins: &load_plugins
  - |
    if [ -n "${PLUGIN_PAYLOAD_B64:-}" ]; then
      echo "$PLUGIN_PAYLOAD_B64" | base64 -d > /tmp/plugins.tar.gz
      tar -xzf /tmp/plugins.tar.gz -C .
      rm -f /tmp/plugins.tar.gz
      echo "plugin payload extracted:"
      find plugins -name '*.py' | head -20
    else
      echo "no PLUGIN_PAYLOAD_B64 set; building without plugin material"
    fi

# ---------------------------------------------------------------------
# gate — the same policy checks the public pipeline runs
# ---------------------------------------------------------------------

gate:dependency-policy:
  <<: *linux_base
  stage: gate
  script:
    - uv lock --check
    - uv run python scripts/release/source_boundary.py

gate:static-analysis:
  <<: *linux_base
  stage: gate
  script:
    - uv sync --frozen --extra full --extra test --extra mcp
    - uv run ruff check
      main SCP03 SCP80 SCP11 SIMCARD Tools yggdrasim_common scripts tests
      --select E9,F

gate:docs-strict:
  <<: *linux_base
  stage: gate
  script:
    - uv pip install --system -r requirements-docs.txt
    - python3 site-docs/_tools/mirror_source_docs.py
    - git diff --exit-code -- site-docs/sources ||
      (echo "site-docs/sources is stale; rerun mirror_source_docs.py" && exit 1)
    - mkdocs build --strict

# ---------------------------------------------------------------------
# test — run the suite twice: as the public build sees it, and with the
# internal plugin surface actually loaded. The second run is the reason
# this pipeline exists; GitHub can never execute it.
# ---------------------------------------------------------------------

test:public-parity:
  <<: *linux_base
  stage: test
  variables:
    YGGDRASIM_ALLOW_PLUGINS: "0"
    PYTHONUNBUFFERED: "1"
  script:
    - uv sync --frozen --extra full --extra test --extra mcp
    - uv run python -m pytest -q --tb=short --disable-warnings
      --no-header --junitxml=report-public.xml tests/
  artifacts:
    when: always
    reports:
      junit: report-public.xml
    expire_in: 2 weeks

test:with-plugins:
  <<: *linux_base
  stage: test
  variables:
    YGGDRASIM_ALLOW_PLUGINS: "1"
    PYTHONUNBUFFERED: "1"
  script:
    - *load_plugins
    - uv sync --frozen --extra full --extra test --extra mcp
    - uv run python -m pytest -q --tb=short --disable-warnings
      --no-header --junitxml=report-internal.xml tests/
  artifacts:
    when: always
    reports:
      junit: report-internal.xml
    expire_in: 2 weeks
  rules:
    # Only meaningful where the protected variable is available.
    - if: $CI_COMMIT_REF_PROTECTED == "true"
      when: on_success
    - when: manual
      allow_failure: true

# ---------------------------------------------------------------------
# build — same matrix as .github/workflows/build.yml
# ---------------------------------------------------------------------

.build_linux: &build_linux
  stage: build
  variables:
    YGGDRASIM_FLAVOR: "$FLAVOR"
  script:
    - |
      if [ "$FLAVOR" = "full" ]; then
        uv sync --frozen --extra full --extra saip --extra build --extra test --extra gui
      else
        uv sync --frozen --extra saip --extra build --extra test --extra gui
      fi
    - uv run python -m PyInstaller --noconfirm --clean yggdrasim_main.spec
    - |
      set -euo pipefail
      BIN="dist/yggdrasim-${FLAVOR}"
      GUI="dist/yggdrasim-gui-${FLAVOR}"
      chmod +x "$BIN" "$GUI"
      "$BIN" --version
      "$GUI" --version
      uv run python scripts/release/validate_release.py artifact "$BIN" "$GUI"
      DOCTOR="$("$BIN" --doctor || true)"
      printf '%s\n' "$DOCTOR"
      printf '%s\n' "$DOCTOR" | grep -E 'usable backends:.*qt'
  artifacts:
    name: "yggdrasim-$CI_JOB_NAME_SLUG-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/yggdrasim-*
    expire_in: 4 weeks

build:linux-amd64:
  <<: [*linux_base, *build_linux]
  parallel:
    matrix:
      - FLAVOR: [clean, full]

build:linux-arm64:
  <<: [*linux_base, *build_linux]
  tags: ["$RUNNER_TAG_LINUX_ARM64"]
  parallel:
    matrix:
      - FLAVOR: [clean, full]
  # Native arm64 runners replace the QEMU emulation the GitHub workflow
  # needs, so this is both faster and a truer Raspberry Pi target.
  before_script:
    - !reference [.linux_base, before_script]
    - test "$(uname -m)" = "aarch64"

build:deb:
  <<: *linux_base
  stage: build
  needs:
    - job: build:linux-amd64
      parallel:
        matrix:
          - FLAVOR: clean
      artifacts: true
  script:
    - VERSION=$(python3 -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
    - ARCH="$(dpkg --print-architecture)"
    - PKGROOT="$(mktemp -d)/yggdrasim_${VERSION}_${ARCH}"
    - mkdir -p "$PKGROOT/DEBIAN" "$PKGROOT/usr/lib/yggdrasim" "$PKGROOT/usr/bin"
    - install -m 0755 dist/yggdrasim-clean "$PKGROOT/usr/lib/yggdrasim/yggdrasim"
    - install -m 0755 dist/yggdrasim-gui-clean "$PKGROOT/usr/lib/yggdrasim/yggdrasim-gui"
    - ln -sf /usr/lib/yggdrasim/yggdrasim "$PKGROOT/usr/bin/yggdrasim"
    - ln -sf /usr/lib/yggdrasim/yggdrasim-gui "$PKGROOT/usr/bin/yggdrasim-gui"
    - |
      cat > "$PKGROOT/DEBIAN/control" <<EOF
      Package: yggdrasim
      Version: ${VERSION}
      Section: utils
      Priority: optional
      Architecture: ${ARCH}
      Maintainer: 1oT OÜ <hampushellsberg@gmail.com>
      Description: YggdraSIM secure-element research toolkit (clean flavor)
      EOF
    - mkdir -p dist-deb
    - dpkg-deb --build "$PKGROOT" "dist-deb/yggdrasim_${VERSION}_${ARCH}.deb"
  artifacts:
    paths:
      - dist-deb/*.deb
    expire_in: 4 weeks

build:docker:
  stage: build
  image: docker:27
  tags: ["$RUNNER_TAG_LINUX_AMD64"]
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker info
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build --file Dockerfile --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - |
      if [ "$CI_COMMIT_REF_NAME" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

# Off by default — flip ENABLE_WINDOWS_BUILD / ENABLE_MACOS_BUILD once a
# runner with the matching tag exists. GitLab.com SaaS Windows runners
# are beta and macOS runners are Premium/Ultimate only, which is why
# these are not simply enabled.
build:windows-clean:
  stage: build
  tags: ["$RUNNER_TAG_WINDOWS"]
  rules:
    - if: $ENABLE_WINDOWS_BUILD == "true"
  variables:
    YGGDRASIM_FLAVOR: "clean"
  script:
    - powershell -ExecutionPolicy Bypass -Command "irm https://astral.sh/uv/install.ps1 | iex"
    - uv sync --frozen --extra saip --extra build --extra test --extra gui
    - uv run python -m PyInstaller --noconfirm --clean yggdrasim_main.spec
  artifacts:
    paths:
      - dist/
    expire_in: 4 weeks

build:macos-clean:
  stage: build
  tags: ["$RUNNER_TAG_MACOS"]
  rules:
    - if: $ENABLE_MACOS_BUILD == "true"
  variables:
    YGGDRASIM_FLAVOR: "clean"
  script:
    - curl -LsSf "https://astral.sh/uv/${UV_VERSION}/install.sh" | sh
    - export PATH="$HOME/.local/bin:$PATH"
    - uv sync --frozen --extra saip --extra build --extra test --extra gui
    - uv run python -m PyInstaller --noconfirm --clean yggdrasim_main.spec
  artifacts:
    paths:
      - dist/
    expire_in: 4 weeks

# ---------------------------------------------------------------------
# package — the internal-only half, shipped beside the bundles
# ---------------------------------------------------------------------

package:plugin-payload:
  <<: *linux_base
  stage: package
  rules:
    - if: $CI_COMMIT_REF_PROTECTED == "true"
  script:
    - *load_plugins
    - |
      if [ -z "$(find plugins -name '*.py' -print -quit)" ]; then
        echo "no plugin material present; nothing to package"
        exit 0
      fi
    - mkdir -p dist-internal
    - tar -czf dist-internal/yggdrasim-plugins-$CI_COMMIT_SHORT_SHA.tar.gz plugins
    - sha256sum dist-internal/*.tar.gz | tee dist-internal/SHA256SUMS
    - |
      cat > dist-internal/INTERNAL-ONLY.txt <<EOF
      INTERNAL ARTEFACT — NOT FOR PUBLIC RELEASE
      Contains operator-supplied plugin material.
      Commit: ${CI_COMMIT_SHA}
      Pipeline: ${CI_PIPELINE_URL}
      Pair with the matching yggdrasim bundle and run with
      YGGDRASIM_ALLOW_PLUGINS=1.
      EOF
  artifacts:
    name: "yggdrasim-plugins-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist-internal/
    expire_in: 4 weeks

# ---------------------------------------------------------------------
# verify — prove the bundles carry no private material
#
# This is the load-bearing job. It asserts that what GitLab built is
# publishable-equivalent to what GitHub builds, so the only internal
# thing in the pipeline is the separate plugin payload. If a future
# change ever fuses plugin code into a bundle, this fails here rather
# than in a public release.
# ---------------------------------------------------------------------

verify:no-private-material:
  <<: *linux_base
  stage: verify
  needs:
    - job: build:linux-amd64
      artifacts: true
    - job: package:plugin-payload
      artifacts: false
      optional: true
  variables:
    # Any string that must never appear inside a shipped bundle. Set a
    # real marker present in your plugin sources as a protected variable
    # and this becomes a genuine tripwire rather than a formality.
    YGGDRASIM_RELEASE_CANARIES: "$RELEASE_CANARIES"
  script:
    - *load_plugins
    - uv sync --frozen --extra saip --extra build --extra test --extra gui
    # Two separate properties keep private code out of a bundle:
    #
    #   1. plugins/ is not a reviewed package and appears nowhere in
    #      yggdrasim_main.spec, so nothing bundles it. Verified by
    #      grepping the spec, not by this guard.
    #   2. a gitignored .py placed *inside* a published package would be
    #      swept in by collect_submodules. That is what this guard
    #      catches, and it is the realistic leak vector — verified to
    #      fire on a planted probe.
    #
    # Re-running (2) with the plugin payload extracted proves the guard
    # still holds in the internal build.
    - |
      set -euo pipefail
      uv run python - <<'PY'
      from pathlib import Path
      import sys
      sys.path.insert(0, "scripts/release")
      from prepare_bundle_data import assert_no_ignored_python_sources
      from source_boundary import load_reviewed_packages
      assert_no_ignored_python_sources(Path("."), load_reviewed_packages())
      print("boundary holds: no ignored Python source below a published package")
      PY
    - |
      for BIN in dist/yggdrasim-clean dist/yggdrasim-full; do
        [ -f "$BIN" ] || continue
        if [ -n "${RELEASE_CANARIES:-}" ]; then
          IFS=','; for CANARY in $RELEASE_CANARIES; do
            if grep -qa -- "$CANARY" "$BIN"; then
              echo "FAIL: canary '$CANARY' found inside $BIN" >&2
              exit 1
            fi
          done; unset IFS
        fi
        echo "clean: $BIN"
      done
    - echo "bundles carry no private material; safe to promote to the public pipeline"

# ---------------------------------------------------------------------
# publish — GitLab Package Registry only. This pipeline never pushes to
# GitHub; the public release stays a deliberate, separate act.
# ---------------------------------------------------------------------

publish:internal-packages:
  <<: *linux_base
  stage: publish
  needs:
    - job: verify:no-private-material
    - job: build:linux-amd64
      artifacts: true
    - job: build:linux-arm64
      artifacts: true
    - job: build:deb
      artifacts: true
    - job: package:plugin-payload
      artifacts: true
      optional: true
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
      allow_failure: true
  script:
    - VERSION=$(python3 -c "import tomllib,pathlib;print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
    - BASE="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/yggdrasim-internal/${VERSION}"
    - |
      upload() {
        [ -f "$1" ] || return 0
        echo "uploading $(basename "$1")"
        curl --fail --silent --show-error \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --upload-file "$1" \
          "${BASE}/$(basename "$1")"
      }
      for f in dist/yggdrasim-* dist-deb/*.deb dist-internal/*; do upload "$f"; done
