"SIMCARD" = [
    "eim_identity_template.json",
    "isdr_config_template.json",
]
"yggdrasim_common.gui_server" = [
    "static/app.css",
    "static/app.js",
    "static/index.html",
    "static/theme-init.js",
    "static/vendor/xterm/NOTICE.md",
    "static/vendor/xterm/addon-fit.js",
    "static/vendor/xterm/xterm.css",
    "static/vendor/xterm/xterm.js",
