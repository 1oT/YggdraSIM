[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yggdrasim"
version = "2.0.0"
description = "YggdraSIM secure-element, eUICC, OTA, and SAIP toolkit."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [
    { name = "Hampus Hellsberg" },
]
maintainers = [
    { name = "1oT OÜ" },
    { name = "Hampus Hellsberg" },
]
keywords = [
    "sim",
    "euicc",
    "esim",
    "uicc",
    "smartcard",
    "globalplatform",
    "scp03",
    "scp11",
    "scp80",
    "saip",
    "sgp22",
    "sgp32",
    "iso7816",
    "etsi",
    "3gpp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Telecommunications Industry",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Hardware",
]
# Core dependencies are kept cross-platform. Card Bridge and remote APDU
# streaming live in the base install; Linux-only local SIMtrace2 HIL packages
# live under optional extras so Windows, macOS, and Raspberry Pi installs stay
# lean. See guides/INSTALL_CLEAN.md and guides/INSTALL_FULL.md for the two
# supported bundling paths.
dependencies = [
    "pyscard",
    "cryptography",
    "pycryptodome",
    "pycryptodomex",
    "pyserial",
    "pytlv",
    "asn1crypto",
    "asn1tools @ git+https://github.com/hampushellsberg-dev/asn1tools-loop-fix.git@46b7dc2fed57f086c5aed6b22f5a34d76f9ecc21",
    "jsonpath-ng",
    "construct>=2.10.70",
    "bidict",
    "pyosmocom>=0.0.12",
    "cmd2>=2.6.2,<3.0",
    "termcolor",
    "colorlog",
    "packaging",
    "requests>=2.31,<3.0",
    "pyyaml",
    "textual>=0.47.0",
    "dnspython>=2.4",
    # pySim is the upstream Osmocom SCP / OTA / SAIP toolkit. SCP03
    # session-key derivation (GPC v2.3 Amd D §4.1.5) and SCP80 / 03.48
    # cipher and CC primitives delegate to it so spec-citation lineage
    # for the cryptographic primitives lives upstream. The wire-format
    # helpers (``Scp03Session.wrap_apdu`` / ``CryptoEngine.build_*``)
    # remain YggdraSIM-specific — see tests/test_scp03_pysim_parity.py
    # and tests/test_scp80_pysim_parity.py for the pinned divergences.
    # Upstream does not publish wheels to PyPI, so we install the git
    # tree directly. The ``saip`` extra below adds the optional,
    # hardened spreadsheet stack used by drop-in SAIP extensions.
    "pySim @ git+https://github.com/osmocom/pysim.git@c50f4b4a0222a964710ce3124a66fe13c804be65",
]

[project.optional-dependencies]
# Adds the local SIMtrace2/RemSIM hardware-in-the-loop dependency stack.
# pyudev only has Linux wheels, so we gate it by platform to keep Windows /
# macOS installs from failing even when the extra is requested accidentally.
hil = [
    "pyudev; sys_platform == 'linux'",
]
# Packaging-side tools used when building the bundled executable.
build = [
    "pyinstaller==6.21.0",
]
# Test-only dependencies. ``httpx`` is required by FastAPI's
# ``TestClient`` (used by the YggdraCore stub-AUSF tests); pulling it
# in here keeps the GUI / GUI-server runtime extras free of an extra
# transitive dep that production deployments do not need.
test = [
    "pytest",
    "httpx",
    "fastapi>=0.110,<1.0",
    "ruff==0.15.15",
]
# Legacy alias kept for backwards compatibility with earlier onboarding
# scripts that call ``pip install -e '.[dev]'``.
dev = [
    "pyinstaller==6.21.0",
    "pytest",
    "httpx",
    "fastapi>=0.110,<1.0",
    "ruff==0.15.15",
]
# Documentation-site tooling. Mirrors ``requirements-docs.txt`` so
# ``pip install yggdrasim[docs]`` alone is sufficient for running
# ``mkdocs build``/``mkdocs serve`` from a fresh checkout.
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.6",
    "pymdown-extensions>=10.13",
]
# ``open5gs`` adds the BYO Open5GS bridge dependency stack. The bridge
# itself loads ``pymongo`` lazily so the import is deferred until an
# operator actually exercises ``yggdracore.open5gs_*``; pulling it in
# under an opt-in extra keeps the default install lean for hosts that
# never run a 5G core. Pin range follows the upstream ``pymongo`` 4.x
# major; older 3.x is missing the type-stub coverage and is not
# tested.
open5gs = [
    "pymongo>=4.5,<5.0",
]
# ``saip`` adds the spreadsheet parser/exporter dependency stack used by
# optional SAIP workbook extensions. pySim itself lives in the base dependency
# block because SCP03 / SCP80 also use it. Keeping workbook libraries in this
# opt-in extra preserves a lean core install while making the documented
# ``pip install 'yggdrasim[saip]'`` path complete.
saip = [
    "openpyxl>=3.1,<4",
    "defusedxml>=0.7,<1",
]
# ``gui`` pulls the FastAPI + uvicorn + pywebview stack for the
# desktop ``--gui`` flow. ``gui-server`` intentionally omits
# pywebview so a headless lab server (``--web-server``) does not need
# GTK / Qt / WebKit on the host. Both extras are additive; a host
# that wants the native desktop window and the remote API installs
# ``yggdrasim[gui]`` (pywebview implies the server deps).
gui = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    # pywebview does not install a Linux web-engine backend by default.
    # The Qt extra is pip-installable and therefore works in an isolated
    # venv and in the frozen-build matrix. macOS and Windows use the native
    # Cocoa/WebView2 dependencies declared by pywebview itself.
    "pywebview[qt]>=5.0,<6.0; sys_platform == 'linux'",
    "pywebview>=5.0,<6.0; sys_platform != 'linux'",
    "websockets>=12.0,<14.0",
]
gui-server = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "websockets>=12.0,<14.0",
]
# ``full`` is the HIL-capable *runtime* profile. Build and test tools stay
# in their own extras so a full production installation does not carry
# PyInstaller or pytest. Developers use ``.[full,build,test]``.
full = [
    "pyudev; sys_platform == 'linux'",
    # Full is a runtime superset of the clean SAIP-capable install.
    "openpyxl>=3.1,<4",
    "defusedxml>=0.7,<1",
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "websockets>=12.0,<14.0",
]

[project.scripts]
yggdrasim = "yggdrasim_common.console_scripts:launcher"
yggdrasim-cli = "yggdrasim_common.console_scripts:launcher"
yggdrasim-gui = "yggdrasim_common.console_scripts:gui"
yggdrasim-web-server = "yggdrasim_common.console_scripts:web_server"
yggdrasim-scp03 = "yggdrasim_common.console_scripts:scp03"
yggdrasim-scp80 = "yggdrasim_common.console_scripts:scp80"
yggdrasim-scp11 = "yggdrasim_common.console_scripts:scp11"
yggdrasim-scp11-live = "yggdrasim_common.console_scripts:scp11_live"
yggdrasim-scp11-relay = "yggdrasim_common.console_scripts:scp11_relay"
yggdrasim-scp11-local-access = "yggdrasim_common.console_scripts:scp11_local_access"
yggdrasim-scp11-eim-local = "yggdrasim_common.console_scripts:scp11_eim_local"
yggdrasim-hil-bridge = "yggdrasim_common.console_scripts:hil_bridge"
yggdrasim-hil-supervisor = "yggdrasim_common.console_scripts:hil_bridge_supervisor"
yggdrasim-card-bridge = "yggdrasim_common.console_scripts:card_bridge"
yggdrasim-lab-agent = "yggdrasim_common.console_scripts:lab_agent"
yggdrasim-profile-package = "yggdrasim_common.console_scripts:profile_package"
yggdrasim-suci-tool = "yggdrasim_common.console_scripts:suci_tool"
yggdrasim-profile-autoload = "yggdrasim_common.console_scripts:profile_autoload"
yggdrasim-apdu-fuzzer = "yggdrasim_common.console_scripts:apdu_fuzzer"
yggdrasim-eum-diag = "yggdrasim_common.console_scripts:eum_diag"
yggdrasim-asn1 = "yggdrasim_common.console_scripts:asn1_tlv_decode"

[project.urls]
Homepage = "https://github.com/1oT/YggdraSIM"
Documentation = "https://github.com/1oT/YggdraSIM/tree/main/guides"
Repository = "https://github.com/1oT/YggdraSIM"
Issues = "https://github.com/1oT/YggdraSIM/issues"
Changelog = "https://github.com/1oT/YggdraSIM/blob/main/CHANGELOG.md"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
# The HIL bridge ships a vendored copy of the RSPRO schema so that an
# installed wheel (``pip install yggdrasim``) can load it even when the
# source tree's ``docs/`` folder is not on disk. The canonical copy
# lives in ``docs/RSPRO.asn``; ``Tools/HilBridge/RSPRO.asn`` is a mirror
# that is ``cp``-refreshed from it as part of the release procedure.
"Tools.HilBridge" = ["RSPRO.asn"]
# The EUM diagnostics dissector is a Lua script that tshark loads at
# runtime via ``-X lua_script:...``. Shipping it as package-data means
# the wheel can resolve its location via ``importlib.resources`` even
# when the source tree is not on disk.
"Tools.EumDiag" = ["dissector.lua"]
"Tools.ProfilePackage" = [
    "examples/saip_batch_data_template.yaml",
    "profile/reference_test_profile.txt",
    "saip_tool_config.json",
    "saip_transcode_tui_config.json",
    "transcode/example_test_profile.transcode.json",
]
"SCP03" = [
    "seeds/aid.txt",
    "seeds/binds.json",
    "seeds/fids.txt",
    "seeds/keys.ini",
]
"SCP80" = ["ota_config.ini"]
"SCP11" = ["es9_ca_lookup.json"]
"SCP11.live" = ["es9_ca_lookup.json"]
"SCP11.local_access" = [
    "profile/metadata/default_profile_metadata.json",
    "profile/test_profile.txt",
]
"SCP11.eim_local" = [
    "eim_identity.json",
    "eim_packages/default_eim_package.json",
    "eim_packages/fake_eim_add_eim_package.json",
    "eim_packages/fake_eim_peer_addition_info.json",
    "eim_packages/first_test_add_eim_other_eim.json",
    "eim_packages/fixtures/eim_to_esim/010_profile_download_trigger_request_first_download.json",
    "eim_packages/fixtures/eim_to_esim/030_eim_acknowledgements_first_download.json",
    "eim_packages/fixtures/esim_to_eim/020_provide_eim_package_result_first_download.json",
    "eim_packages/hotfolder/110_first_test_profile_download_trigger_request.json",
    "eim_packages/templates/template_add_eim.json",
    "eim_packages/templates/template_add_initial_eim.json",
    "eim_packages/templates/template_bound_profile_package.json",
    "eim_packages/templates/template_eim_acknowledgements.json",
    "eim_packages/templates/template_eim_package_request.json",
    "eim_packages/templates/template_eim_package_result.json",
    "eim_packages/templates/template_euicc_memory_reset.json",
    "eim_packages/templates/template_euicc_package_request_ecos.json",
    "eim_packages/templates/template_euicc_package_request_eim_configuration_data.json",
    "eim_packages/templates/template_euicc_package_request_psmos.json",
    "eim_packages/templates/template_euicc_package_result.json",
    "eim_packages/templates/template_get_eim_package.json",
    "eim_packages/templates/template_profile_download_trigger_request.json",
    "eim_packages/templates/template_profile_download_trigger_result.json",
    "eim_packages/templates/template_provide_eim_package_result.json",
    "profile/metadata/default_profile_metadata.json",
    "profile/test_profile.txt",
