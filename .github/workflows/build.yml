name: Build Bundles

# The matrix publishes:
#   * clean CLI + GUI bundles for Linux (x86_64), Windows (x86_64), macOS (arm64)
#   * clean CLI + GUI bundles for Linux arm64 via QEMU, aimed at Raspberry Pi OS 64-bit
#   * full CLI + GUI bundles for Linux (x86_64) — includes the HIL bridge
#   * full CLI + GUI bundles for Linux arm64 via QEMU, aimed at Raspberry Pi + SIMtrace2
#   * a Debian package wrapping the clean Linux x86_64 bundle
#
# See guides/INSTALL_CLEAN.md, guides/INSTALL_FULL.md, and
# guides/INSTALL_RASPBERRYPI.md for how each artefact is expected to be
# consumed downstream.

on:
  push:
    branches: [main, master, "release/**"]
    tags:
      - "v*"
  pull_request:
    branches: [main, master, "release/**"]
  workflow_dispatch:

jobs:
  dependency-policy:
    name: Dependency lock and package boundary
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up locked resolver
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.5.9"
          enable-cache: false

      - name: Verify dependency lock is current
        run: uv lock --check --python 3.11

      - name: Verify frozen resource allowlists
        shell: bash
        run: |
          python scripts/release/prepare_bundle_data.py \
            --flavor clean --stage-dir "${RUNNER_TEMP}/bundle-data-clean"
          python scripts/release/prepare_bundle_data.py \
            --flavor full --stage-dir "${RUNNER_TEMP}/bundle-data-full"

      - name: Build and inspect wheel
        shell: bash
        run: |
          python scripts/release/source_boundary.py
          uv build --sdist --out-dir "${RUNNER_TEMP}/sdist"
          SDIST=$(find "${RUNNER_TEMP}/sdist" -maxdepth 1 -name '*.tar.gz' -print -quit)
          test -n "${SDIST}"
          python scripts/release/verify_sdist.py "${SDIST}"
          uv build --wheel --out-dir "${RUNNER_TEMP}/wheel" "${SDIST}"
          WHEEL=$(find "${RUNNER_TEMP}/wheel" -maxdepth 1 -name '*.whl' -print -quit)
          test -n "${WHEEL}"
          python scripts/release/verify_wheel.py "${WHEEL}"

  docs-strict:
    name: Docs (mkdocs --strict)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install docs dependencies
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.5.9"
          enable-cache: false

      - name: Sync locked docs environment
        shell: bash
        run: uv pip install --system -r requirements-docs.txt

      - name: Mirror repo docs into site-docs/sources/
        shell: bash
        run: python site-docs/_tools/mirror_source_docs.py

      - name: Build docs (strict)
        shell: bash
        run: mkdocs build --strict

  pytest-suite:
    name: Pytest (regression suite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpcsclite-dev pcscd swig pkg-config gpg libudev-dev build-essential

      - name: Install Python dependencies (full + test extras)
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.5.9"
          enable-cache: false

      - name: Sync locked full test environment
        shell: bash
        run: uv sync --frozen --extra full --extra test

      - name: Run fatal Python static-analysis gate
        shell: bash
        run: |
          uv run ruff check \
            main SCP03 SCP80 SCP11 SIMCARD Tools yggdrasim_common scripts tests \
            --select E9,F

      - name: Run pytest suite
        shell: bash
        env:
          PYTHONUNBUFFERED: "1"
          YGGDRASIM_ALLOW_PLUGINS: "0"
        # ``-q --tb=short`` keeps the log small; ``--maxfail=5`` stops after
        # a handful of failures so CI aborts fast on systemic regressions
        # without dumping the whole failure report. pySim-dependent tests
        # auto-skip via ``tests/conftest.py`` when the optional on-disk
        # ``pysim/`` checkout is absent, which is the default on a fresh
        # checkout (pySim is upstream, not vendored). Override by cloning
        # ``git clone https://gitlab.com/osmocom/pysim.git pysim`` into the
        # workspace prior to the pytest step.
        run: |
          uv run python -m pytest -q --tb=short --disable-warnings --no-header --maxfail=5 tests/

  build-linux-x86_64:
    name: Linux x86_64 (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [clean, full]
    outputs:
      version: ${{ steps.meta.outputs.version }}
      clean_artifact_name: ${{ steps.meta.outputs.clean_artifact_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Resolve package metadata
        id: meta
        shell: bash
        run: |
          VERSION=$(python -c "import tomllib; from pathlib import Path; data = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8')); print(data['project']['version'])")
          FLAVOR="${{ matrix.flavor }}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=yggdrasim-linux-x86_64-${FLAVOR}-${VERSION}" >> "$GITHUB_OUTPUT"
          if [ "${FLAVOR}" = "clean" ]; then
            echo "clean_artifact_name=yggdrasim-linux-x86_64-clean-${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpcsclite-dev pcscd swig pkg-config gpg \
            libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 xauth xvfb

      - name: Set up locked resolver
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.5.9"
          enable-cache: false

      - name: Install Python dependencies (clean)
        if: matrix.flavor == 'clean'
        shell: bash
        run: uv sync --frozen --extra saip --extra build --extra test --extra gui

      - name: Install Python dependencies (full)
        if: matrix.flavor == 'full'
        shell: bash
        run: uv sync --frozen --extra full --extra saip --extra build --extra test --extra gui

      - name: Build Linux bundle
        env:
          YGGDRASIM_FLAVOR: ${{ matrix.flavor }}
        run: uv run python -m PyInstaller --noconfirm --clean yggdrasim_main.spec

      - name: Smoke test Linux bundle
        shell: bash
        env:
          YGGDRASIM_FLAVOR: ${{ matrix.flavor }}
        run: |
          BIN="dist/yggdrasim-${{ matrix.flavor }}"
          GUI_BIN="dist/yggdrasim-gui-${{ matrix.flavor }}"
          chmod +x "${BIN}"
          chmod +x "${GUI_BIN}"
          "${BIN}" --version
          "${GUI_BIN}" --version
          DOCTOR_OUTPUT=$("${BIN}" --doctor || true)
          printf '%s\n' "${DOCTOR_OUTPUT}"
          printf '%s\n' "${DOCTOR_OUTPUT}" | grep -E 'usable backends:.*qt'
          uv run python scripts/release/validate_release.py artifact "${BIN}" "${GUI_BIN}"
          set +e
          timeout 12s xvfb-run -a "${GUI_BIN}" \
            >"${RUNNER_TEMP}/yggdrasim-gui-smoke.log" 2>&1
          GUI_STATUS=$?
          set -e
          case "${GUI_STATUS}" in
            0|124) ;;
            *)
              cat "${RUNNER_TEMP}/yggdrasim-gui-smoke.log"
              echo "GUI exited before the Xvfb smoke window could stay open" >&2
              exit "${GUI_STATUS}"
              ;;
          esac

      - name: Upload Linux bundle artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: |
            dist/yggdrasim-${{ matrix.flavor }}
            dist/yggdrasim-gui-${{ matrix.flavor }}
          if-no-files-found: error
          retention-days: 7

  build-linux-arm64-clean:
    name: Linux arm64 clean (Raspberry Pi)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Resolve package metadata
        id: meta
        shell: bash
        run: |
          VERSION=$(python3 -c "import tomllib; from pathlib import Path; data = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8')); print(data['project']['version'])")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=yggdrasim-linux-arm64-clean-${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU for arm64
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Build arm64 bundle inside Debian container
        shell: bash
        # ``python3-dev`` supplies ``Python.h`` for pyscard. ``git`` resolves
        # the commit-pinned pySim and asn1tools sources in the locked base
        # dependency graph.
        run: |
          mkdir -p dist
          docker run --rm --platform linux/arm64 \
            -v "$PWD":/src -w /src \
            -e YGGDRASIM_FLAVOR=clean \
            debian:bookworm-slim bash -lc '
              set -eux
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                python3 python3-pip python3-venv python3-dev \
                python3-pyqt5 python3-pyqt5.qtwebengine python3-pyqt5.qtwebchannel \
                libpcsclite-dev pcscd swig pkg-config gpg git \
                libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
                build-essential
              git config --global --add safe.directory /src
              python3 -m venv /opt/uv
              /opt/uv/bin/pip install "uv==0.5.9"
              python3 -m venv --system-site-packages /opt/venv
              export UV_PROJECT_ENVIRONMENT=/opt/venv
              /opt/uv/bin/uv sync --frozen \
                --extra saip --extra build --extra test --extra gui
              /opt/uv/bin/uv run python -c \
                "from qtpy import QtWebEngineWidgets; print(QtWebEngineWidgets.__name__)"
              /opt/uv/bin/uv run python -m PyInstaller --noconfirm --clean yggdrasim_main.spec
              chmod +x dist/yggdrasim-clean
              chmod +x dist/yggdrasim-gui-clean
              dist/yggdrasim-clean --version
              dist/yggdrasim-gui-clean --version
              DOCTOR_OUTPUT=$(dist/yggdrasim-clean --doctor || true)
              printf "%s\n" "${DOCTOR_OUTPUT}"
              printf "%s\n" "${DOCTOR_OUTPUT}" | grep -E "usable backends:.*qt"
              /opt/uv/bin/uv run python scripts/release/validate_release.py \
                artifact dist/yggdrasim-clean dist/yggdrasim-gui-clean
            '

      - name: Upload arm64 bundle artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: |
            dist/yggdrasim-clean
            dist/yggdrasim-gui-clean
          if-no-files-found: error
          retention-days: 7

  build-linux-arm64-full:
    name: Linux arm64 full (Raspberry Pi + HIL)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Resolve package metadata
        id: meta
        shell: bash
        run: |
          VERSION=$(python3 -c "import tomllib; from pathlib import Path; data = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8')); print(data['project']['version'])")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=yggdrasim-linux-arm64-full-${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU for arm64
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Build arm64 full bundle inside Debian container
        shell: bash
        # The ``full`` extra resolves ``pySim`` from a ``git+https://``
        # source, so ``git`` must be present in the container. ``python3-dev``
        # supplies ``Python.h`` for the ``pyscard`` C extension build.
        run: |
          mkdir -p dist
          docker run --rm --platform linux/arm64 \
            -v "$PWD":/src -w /src \
            -e YGGDRASIM_FLAVOR=full \
            debian:bookworm-slim bash -lc '
              set -eux
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                python3 python3-pip python3-venv python3-dev \
                python3-pyqt5 python3-pyqt5.qtwebengine python3-pyqt5.qtwebchannel \
                libpcsclite-dev pcscd swig pkg-config gpg git \
                libudev-dev libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 \
                build-essential
              git config --global --add safe.directory /src
              python3 -m venv /opt/uv
              /opt/uv/bin/pip install "uv==0.5.9"
              python3 -m venv --system-site-packages /opt/venv
              export UV_PROJECT_ENVIRONMENT=/opt/venv
              /opt/uv/bin/uv sync --frozen \
                --extra full --extra saip --extra build --extra test --extra gui
              /opt/uv/bin/uv run python -c \
                "from qtpy import QtWebEngineWidgets; print(QtWebEngineWidgets.__name__)"
              /opt/uv/bin/uv run python -m PyInstaller --noconfirm --clean yggdrasim_main.spec
              chmod +x dist/yggdrasim-full
              chmod +x dist/yggdrasim-gui-full
              dist/yggdrasim-full --version
              dist/yggdrasim-gui-full --version
              DOCTOR_OUTPUT=$(dist/yggdrasim-full --doctor || true)
              printf "%s\n" "${DOCTOR_OUTPUT}"
              printf "%s\n" "${DOCTOR_OUTPUT}" | grep -E "usable backends:.*qt"
              /opt/uv/bin/uv run python scripts/release/validate_release.py \
                artifact dist/yggdrasim-full dist/yggdrasim-gui-full
            '

      - name: Upload arm64 full bundle artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: |
            dist/yggdrasim-full
            dist/yggdrasim-gui-full
          if-no-files-found: error
          retention-days: 7

  build-windows-clean:
    name: Windows x86_64 clean
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Resolve package metadata
        id: meta
        shell: pwsh
        run: |
          $version = python -c "import tomllib; from pathlib import Path; data = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8')); print(data['project']['version'])"
          "version=$version" >> $env:GITHUB_OUTPUT
          "artifact_name=yggdrasim-windows-x86_64-clean-$version" >> $env:GITHUB_OUTPUT

      - name: Install Windows build dependencies
        shell: pwsh
        run: choco install swig -y

      - name: Set up locked resolver
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.5.9"
          enable-cache: false

      - name: Install Python dependencies
        shell: pwsh
        run: uv sync --frozen --extra saip --extra build --extra test --extra gui

      - name: Verify portable Remote Lab and Card Bridge contracts
        shell: pwsh
        run: |
          uv run python -m pytest -q --tb=short --disable-warnings --no-header --maxfail=1 `
            tests/test_remote_cross_platform_boundary.py `
            tests/test_remote_lab.py `
            tests/test_gui_card_bridge_actions.py `
            tests/test_gui_card_bridge_actions_http.py `
            tests/test_apdu_relay_service.py `
            tests/test_card_backend_relay_token.py `
            tests/test_hil_bridge_card_relay.py `
            tests/test_secure_files_windows.py

      - name: Build Windows bundle
        shell: pwsh
        env:
          YGGDRASIM_FLAVOR: clean
        run: uv run python -m PyInstaller --noconfirm --clean yggdrasim_main.spec

      - name: Require Authenticode credentials for tagged releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:SIGNING_PASSWORD)) {
            throw 'Tagged releases require WINDOWS_CODESIGN_PFX_BASE64 and WINDOWS_CODESIGN_PASSWORD.'
          }

      - name: Authenticode-sign Windows release binaries
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          SIGNING_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'yggdrasim-codesign.pfx'
          try {
            [IO.File]::WriteAllBytes(
              $pfx,
              [Convert]::FromBase64String($env:SIGNING_PFX_BASE64)
            )
            $signtool = (Get-Command signtool.exe -ErrorAction Stop).Source
            foreach ($binary in @(
              '.\dist\yggdrasim-clean.exe',
              '.\dist\yggdrasim-gui-clean.exe'
            )) {
              & $signtool sign /fd SHA256 /td SHA256 `
                /tr 'https://timestamp.digicert.com' `
                /f $pfx /p $env:SIGNING_PASSWORD $binary
              if ($LASTEXITCODE -ne 0) { throw "signtool sign failed for $binary" }
              & $signtool verify /pa /all $binary
              if ($LASTEXITCODE -ne 0) { throw "signtool verify failed for $binary" }
            }
          }
          finally {
            Remove-Item -LiteralPath $pfx -Force -ErrorAction SilentlyContinue
          }

      - name: Smoke test Windows bundle
        shell: pwsh
        run: |
          .\dist\yggdrasim-clean.exe --version
          .\dist\yggdrasim-gui-clean.exe --version
          uv run python scripts/release/validate_release.py artifact `
            .\dist\yggdrasim-clean.exe .\dist\yggdrasim-gui-clean.exe

      - name: Upload Windows bundle artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: |
            dist/yggdrasim-clean.exe
            dist/yggdrasim-gui-clean.exe
          if-no-files-found: error
          retention-days: 7

  build-macos-clean:
    name: macOS ${{ matrix.arch }} clean
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Resolve package metadata
        id: meta
        shell: bash
        run: |
          VERSION=$(python -c "import tomllib; from pathlib import Path; data = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8')); print(data['project']['version'])")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=yggdrasim-macos-${{ matrix.arch }}-clean-${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Install macOS build dependencies
        shell: bash
        run: |
          brew update
          brew install swig || true

      - name: Set up locked resolver
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.5.9"
          enable-cache: false

      - name: Install Python dependencies
        shell: bash
        run: uv sync --frozen --extra saip --extra build --extra test --extra gui

      - name: Verify portable Remote Lab and Card Bridge contracts
        shell: bash
        run: |
          uv run python -m pytest -q --tb=short --disable-warnings --no-header --maxfail=1 \
            tests/test_remote_cross_platform_boundary.py \
            tests/test_remote_lab.py \
            tests/test_gui_card_bridge_actions.py \
            tests/test_gui_card_bridge_actions_http.py \
            tests/test_apdu_relay_service.py \
            tests/test_card_backend_relay_token.py \
            tests/test_hil_bridge_card_relay.py

      - name: Build macOS bundle
        shell: bash
        env:
          YGGDRASIM_FLAVOR: clean
        run: uv run python -m PyInstaller --noconfirm --clean yggdrasim_main.spec

      - name: Require signing and notarization credentials for tagged releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CODESIGN_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CODESIGN_CERT_PASSWORD }}
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          set -eu
          for name in CERT_P12_BASE64 CERT_PASSWORD CODESIGN_IDENTITY \
            APPLE_ID APPLE_ID_PASSWORD APPLE_TEAM_ID; do
            test -n "$(printenv "${name}")" || {
              echo "Tagged releases require ${name}." >&2
              exit 2
            }
          done

      - name: Sign and notarize macOS release binaries
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          CERT_P12_BASE64: ${{ secrets.MACOS_CODESIGN_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.MACOS_CODESIGN_CERT_PASSWORD }}
          CODESIGN_IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          APPLE_ID: ${{ secrets.MACOS_NOTARY_APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.MACOS_NOTARY_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.MACOS_NOTARY_TEAM_ID }}
        run: |
          set -eu
          P12="${RUNNER_TEMP}/yggdrasim-codesign.p12"
          KEYCHAIN="${RUNNER_TEMP}/yggdrasim-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          ARCHIVE="${RUNNER_TEMP}/yggdrasim-notary.zip"
          GUI_ARCHIVE="${RUNNER_TEMP}/yggdrasim-gui-notary.zip"
          cleanup() {
            security delete-keychain "${KEYCHAIN}" >/dev/null 2>&1 || true
            rm -f "${P12}" "${ARCHIVE}" "${GUI_ARCHIVE}"
          }
          trap cleanup EXIT
          printf '%s' "${CERT_P12_BASE64}" | base64 --decode > "${P12}"
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security import "${P12}" -k "${KEYCHAIN}" -P "${CERT_PASSWORD}" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security list-keychains -d user -s "${KEYCHAIN}"
          for binary in dist/yggdrasim-clean dist/yggdrasim-gui-clean; do
            codesign --force --options runtime --timestamp \
              --keychain "${KEYCHAIN}" --sign "${CODESIGN_IDENTITY}" "${binary}"
            codesign --verify --deep --strict --verbose=2 "${binary}"
          done
          ditto -c -k --keepParent dist/yggdrasim-clean "${ARCHIVE}"
          ditto -c -k --keepParent dist/yggdrasim-gui-clean \
            "${GUI_ARCHIVE}"
          xcrun notarytool submit "${ARCHIVE}" --wait \
            --apple-id "${APPLE_ID}" --password "${APPLE_ID_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}"
          xcrun notarytool submit "${GUI_ARCHIVE}" --wait \
            --apple-id "${APPLE_ID}" --password "${APPLE_ID_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}"

      - name: Smoke test macOS bundle
        shell: bash
        run: |
          chmod +x dist/yggdrasim-clean
          chmod +x dist/yggdrasim-gui-clean
          dist/yggdrasim-clean --version
          dist/yggdrasim-gui-clean --version
          uv run python scripts/release/validate_release.py artifact \
            dist/yggdrasim-clean dist/yggdrasim-gui-clean

      - name: Upload macOS bundle artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          path: |
            dist/yggdrasim-clean
            dist/yggdrasim-gui-clean
          if-no-files-found: error
          retention-days: 7

  build-linux-deb-clean:
    name: Debian package (clean)
    runs-on: ubuntu-latest
    needs:
      - build-linux-x86_64

    steps:
      - name: Download clean Linux bundle
        uses: actions/download-artifact@v6
        with:
          name: ${{ needs.build-linux-x86_64.outputs.clean_artifact_name }}
          path: dist

      - name: Build Debian package
        id: deb
        shell: bash
        run: |
          VERSION="${{ needs.build-linux-x86_64.outputs.version }}"
          ARCH="$(dpkg --print-architecture)"
          PKGROOT="$RUNNER_TEMP/yggdrasim-deb"
          DEB_NAME="yggdrasim-clean_${VERSION}_${ARCH}.deb"
          mkdir -p "$PKGROOT/DEBIAN" "$PKGROOT/usr/lib/yggdrasim" "$PKGROOT/usr/bin"
          install -m 0755 dist/yggdrasim-clean "$PKGROOT/usr/lib/yggdrasim/yggdrasim"
          install -m 0755 dist/yggdrasim-gui-clean "$PKGROOT/usr/lib/yggdrasim/yggdrasim-gui"
          ln -s ../lib/yggdrasim/yggdrasim "$PKGROOT/usr/bin/yggdrasim"
          ln -s ../lib/yggdrasim/yggdrasim-gui "$PKGROOT/usr/bin/yggdrasim-gui"
          cat > "$PKGROOT/DEBIAN/control" <<EOF
          Package: yggdrasim-clean
          Version: ${VERSION}
          Section: utils
          Priority: optional
          Architecture: ${ARCH}
          Maintainer: GitHub Actions
          Depends: libpcsclite1, pcscd, gpg, libegl1, libgl1, libxkbcommon-x11-0, libxcb-cursor0
          Description: YggdraSIM secure-element and eUICC toolkit (clean flavor, no HIL bridge)
          EOF
          dpkg-deb --build "$PKGROOT" "dist/${DEB_NAME}"
          echo "artifact_name=yggdrasim-linux-deb-clean-${VERSION}" >> "$GITHUB_OUTPUT"
          echo "artifact_path=dist/${DEB_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload Debian package artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.deb.outputs.artifact_name }}
          path: ${{ steps.deb.outputs.artifact_path }}
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs:
      - dependency-policy
      - docs-strict
      - pytest-suite
      - build-linux-x86_64
      - build-linux-arm64-clean
      - build-linux-arm64-full
      - build-windows-clean
      - build-macos-clean
      - build-linux-deb-clean
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          VERSION=$(python3 -c "import tomllib; from pathlib import Path; data = tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8')); print(data['project']['version'])")
          TAG="${GITHUB_REF#refs/tags/}"
          python3 scripts/release/validate_release.py tag --tag "${TAG}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Stage release directory
        shell: bash
        run: |
          mkdir -p release-assets
          mkdir -p dl

      - name: Download Linux x86_64 clean
        uses: actions/download-artifact@v6
        with:
          name: yggdrasim-linux-x86_64-clean-${{ steps.meta.outputs.version }}
          path: dl/linux-x86_64-clean

      - name: Download Linux x86_64 full
        uses: actions/download-artifact@v6
        with:
          name: yggdrasim-linux-x86_64-full-${{ steps.meta.outputs.version }}
          path: dl/linux-x86_64-full

      - name: Download Linux arm64 clean
        uses: actions/download-artifact@v6
        with:
          name: yggdrasim-linux-arm64-clean-${{ steps.meta.outputs.version }}
          path: dl/linux-arm64-clean

      - name: Download Linux arm64 full
        uses: actions/download-artifact@v6
        with:
          name: yggdrasim-linux-arm64-full-${{ steps.meta.outputs.version }}
          path: dl/linux-arm64-full

      - name: Download Windows x86_64 clean
        uses: actions/download-artifact@v6
        with:
          name: yggdrasim-windows-x86_64-clean-${{ steps.meta.outputs.version }}
          path: dl/windows-x86_64-clean

      - name: Download macOS arm64 clean
        uses: actions/download-artifact@v6
        with:
          name: yggdrasim-macos-arm64-clean-${{ steps.meta.outputs.version }}
          path: dl/macos-arm64-clean

      - name: Download Linux Debian package (clean)
        uses: actions/download-artifact@v6
        with:
          name: yggdrasim-linux-deb-clean-${{ steps.meta.outputs.version }}
          path: dl/linux-deb-clean

      # The install scripts (scripts/install/_common.sh::yg_asset_name and
      # install-windows.ps1::Install-YgFromRelease) consume the assets at
      # ``yggdrasim-{os}-{arch}-{flavor}[.exe]``. The build matrix uploads
      # them as ``yggdrasim-{flavor}[.exe]`` inside per-platform artefact
      # bundles, so this step renames + sets +x on the way to the Release.
      - name: Rename artefacts to install-script asset names
        shell: bash
        run: |
          set -eu
          install -m 0755 dl/linux-x86_64-clean/yggdrasim-clean   release-assets/yggdrasim-linux-x86_64-clean
          install -m 0755 dl/linux-x86_64-clean/yggdrasim-gui-clean release-assets/yggdrasim-gui-linux-x86_64-clean
          install -m 0755 dl/linux-x86_64-full/yggdrasim-full     release-assets/yggdrasim-linux-x86_64-full
          install -m 0755 dl/linux-x86_64-full/yggdrasim-gui-full release-assets/yggdrasim-gui-linux-x86_64-full
          install -m 0755 dl/linux-arm64-clean/yggdrasim-clean    release-assets/yggdrasim-linux-arm64-clean
          install -m 0755 dl/linux-arm64-clean/yggdrasim-gui-clean release-assets/yggdrasim-gui-linux-arm64-clean
          install -m 0755 dl/linux-arm64-full/yggdrasim-full      release-assets/yggdrasim-linux-arm64-full
          install -m 0755 dl/linux-arm64-full/yggdrasim-gui-full  release-assets/yggdrasim-gui-linux-arm64-full
          install -m 0755 dl/macos-arm64-clean/yggdrasim-clean    release-assets/yggdrasim-macos-arm64-clean
          install -m 0755 dl/macos-arm64-clean/yggdrasim-gui-clean release-assets/yggdrasim-gui-macos-arm64-clean
          install -m 0755 dl/windows-x86_64-clean/yggdrasim-clean.exe release-assets/yggdrasim-windows-x86_64-clean.exe
          install -m 0755 dl/windows-x86_64-clean/yggdrasim-gui-clean.exe release-assets/yggdrasim-gui-windows-x86_64-clean.exe
          cp dl/linux-deb-clean/yggdrasim-clean_${{ steps.meta.outputs.version }}_amd64.deb release-assets/

      - name: Generate locked dependency SBOM
        shell: bash
        run: |
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" \
            python3 scripts/release/generate_sbom.py \
            --version "${{ steps.meta.outputs.version }}" \
            --output "release-assets/yggdrasim-${{ steps.meta.outputs.version }}.cdx.json"

      - name: Generate SHA256 manifest
        shell: bash
        working-directory: release-assets
        run: |
          set -eu
          : > SHA256SUMS
          for f in $(ls | grep -v '^SHA256SUMS$' | sort); do
            sha256sum "${f}" >> SHA256SUMS
          done
          echo '--- SHA256SUMS ---'
          cat SHA256SUMS

      # Guard the Release publish step against a silent matrix drift: if a new
      # platform is added to the build matrix without the matching install-
      # script asset name, this gate fires before ``gh release create``.
      - name: Verify release-asset names match the install-script pattern
        shell: bash
        run: |
          set -eu
          required="
            yggdrasim-linux-x86_64-clean
            yggdrasim-gui-linux-x86_64-clean
            yggdrasim-linux-x86_64-full
            yggdrasim-gui-linux-x86_64-full
            yggdrasim-linux-arm64-clean
            yggdrasim-gui-linux-arm64-clean
            yggdrasim-linux-arm64-full
            yggdrasim-gui-linux-arm64-full
            yggdrasim-macos-arm64-clean
            yggdrasim-gui-macos-arm64-clean
            yggdrasim-windows-x86_64-clean.exe
            yggdrasim-gui-windows-x86_64-clean.exe
            yggdrasim-${{ steps.meta.outputs.version }}.cdx.json
            SHA256SUMS
          "
          missing=
          for asset in ${required}; do
            if [ ! -f "release-assets/${asset}" ]; then
              missing="${missing} ${asset}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "missing release assets:${missing}" >&2
            exit 1
          fi
          echo 'all required release assets present'
          ls -la release-assets/

      - name: Sign release provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: release-assets/*

      # ``--notes-from-tag`` reuses the annotated tag message we shipped with
      # v1.0.0 (BCD EID marker + HIL fix + audit rectifications). Future tags
      # should keep the annotation pattern; ``release-checklist.md`` documents
      # this contract.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -eu
          TAG="${{ steps.meta.outputs.tag }}"
          PRERELEASE_FLAG=""
          case "${TAG}" in
            *-rc*|*-alpha*|*-beta*|*-pre*) PRERELEASE_FLAG="--prerelease" ;;
          esac
          gh release create "${TAG}" \
            --title "YggdraSIM ${TAG}" \
            --notes-from-tag \
            --verify-tag \
            ${PRERELEASE_FLAG} \
            release-assets/*
