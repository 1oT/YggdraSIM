name: Deploy documentation site

# yggdrasim.1ot.com is a GitHub Pages site in workflow mode: the custom
# domain is a repository setting, and the site is whatever the last run
# of this workflow uploaded. No branch holds the built site. The
# 1oT-branded variant of the manual (mkdocs.oneot.yml over site-docs/) is
# built strictly from main and deployed as one Pages artifact.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the manual (mkdocs.oneot.yml, strict)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install docs dependencies
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.5.9"
          enable-cache: false

      - name: Sync locked docs environment
        shell: bash
        run: uv pip install --system -r requirements-docs.txt

      - name: Mirror repo docs into site-docs/sources/
        shell: bash
        run: python site-docs/_tools/mirror_source_docs.py

      - name: Build the branded manual (strict)
        shell: bash
        run: mkdocs build --strict -f mkdocs.oneot.yml

      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload the site as the Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site-oneot

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
